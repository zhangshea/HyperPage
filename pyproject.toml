# Packaging of the hyperpage library (pip install -e .).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperpage"
version = "1.0.0"
description = "HyperPage: learned page layouts for disk-resident graph vector indexes"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy", "numba", "scipy"]

[tool.setuptools]
packages = ["hyperpage"]
